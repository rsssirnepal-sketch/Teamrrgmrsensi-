<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Free Fire Sensitivity Pro • iPhone Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(22, 27, 39, 0.72);
      --bg-card-hover: rgba(30, 37, 54, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-bright: rgba(255, 75, 75, 0.35);
      --apple-white: #f5f5f7;
      --apple-subtext: #8e95a5;
      --neon-red: #ff3b30;
      --neon-orange: #ff9500;
      --neon-gold: #ffd60a;
      --neon-cyan: #30d158;
      --accent-grad: linear-gradient(135deg, #ff3b30 0%, #ff6b3d 50%, #ff9500 100%);
      --surface-blur: blur(20px);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --nav-height: 72px;
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 59, 48, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 149, 0, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(10, 14, 24, 0.9) 0%, var(--bg-dark) 100%);
      color: var(--apple-white);
      font-family: var(--font-system);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(var(--nav-height) + 24px);
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .app-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 80px 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,59,48,0.2), rgba(255,149,0,0.15));
      border: 1px solid rgba(255,59,48,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(255,59,48,0.2);
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(180deg, #ffffff 30%, #c4cbd4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 11px;
      font-weight: 600;
      color: var(--neon-orange);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .ios-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: var(--surface-blur);
    }

    /* Card standard */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: var(--surface-blur);
      -webkit-backdrop-filter: var(--surface-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    /* Device Selector Box */
    .device-box {
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      position: relative;
    }

    .device-box:active {
      transform: scale(0.99);
    }

    .device-selector-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .device-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .phone-glyph {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .device-title-wrap h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--apple-white);
      margin-bottom: 3px;
    }

    .device-sub {
      font-size: 12px;
      color: var(--apple-subtext);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spec-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 600;
      color: #cbd5e1;
    }

    .chevron-icon {
      font-size: 18px;
      color: var(--apple-subtext);
      transition: transform 0.2s ease;
    }

    /* Upcoming Banner */
    .upcoming-tag {
      background: rgba(255, 149, 0, 0.15);
      border: 1px solid rgba(255, 149, 0, 0.35);
      color: var(--neon-orange);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
    }

    /* Headshot Mode Toggle Strip */
    .preset-headline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .preset-headline h2 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preset-subtitle {
      font-size: 12px;
      color: var(--apple-subtext);
      margin-top: 2px;
    }

    .mode-pills {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      background: rgba(10, 14, 22, 0.6);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 16px;
    }

    .mode-pill {
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--apple-subtext);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .mode-pill span.sub {
      font-size: 9px;
      font-weight: 500;
      opacity: 0.8;
    }

    .mode-pill.active {
      background: rgba(255, 59, 48, 0.15);
      border-color: rgba(255, 59, 48, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 59, 48, 0.25);
    }

    .mode-pill.active.mode-balanced {
      background: rgba(255, 149, 0, 0.15);
      border-color: rgba(255, 149, 0, 0.4);
      box-shadow: 0 4px 14px rgba(255, 149, 0, 0.2);
    }

    .mode-pill.active.mode-stable {
      background: rgba(48, 209, 88, 0.15);
      border-color: rgba(48, 209, 88, 0.4);
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.2);
    }

    /* Sensitivity Bars List */
    .sens-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sens-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      transition: all 0.2s ease;
    }

    .sens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .sens-name {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sens-val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--apple-white);
      letter-spacing: 0.5px;
    }

    .sens-val small {
      font-size: 10px;
      color: var(--apple-subtext);
    }

    .progress-track {
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent-grad);
      transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.5);
    }

    /* Fire Button Card */
    .hud-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-tile {
      background: var(--bg-card);
      backdrop-filter: var(--surface-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-tile .title {
      font-size: 11px;
      font-weight: 600;
      color: var(--apple-subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-tile .value {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 800;
      margin: 6px 0 2px 0;
      color: var(--neon-gold);
    }

    .stat-tile .note {
      font-size: 10.5px;
      color: var(--apple-subtext);
    }

    /* Actions */
    .btn-action {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      padding: 15px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-grad);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(255, 59, 48, 0.35);
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.98);
      filter: brightness(1.1);
    }

    .copy-success {
      background: linear-gradient(135deg, #28a745 0%, #30d158 100%) !important;
      box-shadow: 0 10px 24px rgba(48, 209, 88, 0.35) !important;
    }

    /* Notice & Disclaimer */
    .notice-box {
      background: rgba(255, 149, 0, 0.08);
      border: 1px solid rgba(255, 149, 0, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .notice-item {
      font-size: 11.5px;
      line-height: 1.4;
      color: #f1c48f;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    /* Modal Device Picker */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: #141824;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px 26px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: #cbd5e1;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-bar-wrap {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      width: 100%;
      font-family: inherit;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      padding: 10px 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.05);
      color: var(--apple-subtext);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .filter-chip.active {
      background: rgba(255, 59, 48, 0.2);
      color: #ff6b3d;
      border-color: rgba(255, 59, 48, 0.35);
    }

    .device-list {
      overflow-y: auto;
      padding: 10px 18px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .device-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .device-row:hover, .device-row:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .device-row.selected {
      background: rgba(255, 59, 48, 0.14);
      border-color: rgba(255, 59, 48, 0.4);
    }

    .device-row-info h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .device-row-info p {
      font-size: 11px;
      color: var(--apple-subtext);
    }

    /* Views */
    .view-content {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    .view-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Aim Test Mini-Game */
    .aim-canvas-wrap {
      height: 290px;
      background: #080b12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .aim-target {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff3b30 0%, #ff453a 50%, #8b0000 100%);
      border: 3px solid #ffffff;
      box-shadow: 0 0 16px rgba(255, 59, 48, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: crosshair;
      transform: translate(-50%, -50%);
      transition: transform 0.05s ease;
    }

    .aim-target:active {
      transform: translate(-50%, -50%) scale(0.85);
    }

    .aim-hud-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--apple-subtext);
    }

    .aim-hud-bar strong {
      color: var(--apple-white);
      font-family: var(--font-mono);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(12, 16, 26, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 520px;
      margin: 0 auto;
      z-index: 900;
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--apple-subtext);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      width: 60px;
      transition: color 0.15s ease;
    }

    .nav-btn .nav-icon {
      font-size: 20px;
      transition: transform 0.15s ease;
    }

    .nav-btn.active {
      color: #ff453a;
    }

    .nav-btn.active .nav-icon {
      transform: scale(1.15);
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(48, 209, 88, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Tips & Guide */
    .drag-guide-item {
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .drag-guide-item h4 {
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drag-guide-item p {
      font-size: 11.5px;
      color: var(--apple-subtext);
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">🍎</div>
        <div class="brand-text">
          <h1>Sensi Pro • iOS</h1>
          <p>Headshot Aim Optimizer</p>
        </div>
      </div>
      <div class="ios-badge">
        <span>⚡ iOS Only</span>
      </div>
    </header>

    <!-- VIEW 1: HOME / SENSITIVITY VIEW (Default) -->
    <main id="view-home" class="view-content active">
      <!-- Selected iPhone Card -->
      <section class="glass-card device-box" onclick="openDevicePicker()">
        <div class="device-selector-head">
          <div class="device-meta">
            <div class="phone-glyph">📱</div>
            <div class="device-title-wrap">
              <h3 id="current-device-name">iPhone 15 Pro</h3>
              <div class="device-sub">
                <span class="spec-pill" id="device-spec-display">6.1" OLED • 120Hz</span>
                <span class="spec-pill" id="device-chip-display">A17 Pro</span>
              </div>
            </div>
          </div>
          <div class="chevron-icon">▼</div>
        </div>
        <div id="upcoming-badge-wrapper" style="display:none;">
          <div class="upcoming-tag">
